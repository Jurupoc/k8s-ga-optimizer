apiVersion: batch/v1
kind: Job
metadata:
  name: app-ga-loadtest
  namespace: default
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: loadtest
        image: app-ga-loadtest:latest
        imagePullPolicy: Never
        env:
        # Reproduz EXATAMENTE a carga aplicada pelo GA/NSGA/RS durante a avaliação,
        # para validar (calibrar) os extremos do search space antes da run final.
        - name: TARGET_URL
          value: "http://app-ga.default.svc.cluster.local:8080"
        - name: DURATION
          value: "90"
        - name: CONCURRENCY
          value: "22"
        - name: LOG_LEVEL
          value: "DEBUG"
