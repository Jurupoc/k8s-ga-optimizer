apiVersion: batch/v1
kind: Job
metadata:
  name: nsga-optimizer
  namespace: default
spec:
  backoffLimit: 0
  completions: 1
  parallelism: 1
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: ga-agent
      containers:
        - name: nsga-optimizer
          image: nsga-optimizer:latest
          imagePullPolicy: Never
          volumeMounts:
            - name: results
              mountPath: /results
          command: ["python", "-u", "scripts/run_nsga.py"]
          env:
            # ----- NSGA-II -----
            - name: NSGA_POPULATION
              value: "12"
            - name: NSGA_GENERATIONS
              value: "8"
            - name: NSGA_CROSSOVER_RATE
              value: "0.9"
            - name: NSGA_MUTATION_RATE
              value: "0.2"
            # Próximas execuções (editar SEED + OUTPUT_DIR juntos):
            #   seed=42 → /results/nsga-12-8-seed42  (RE-RUN com dedup; mover antigo p/ -buggy)
            #   seed=44 → /results/nsga-12-8-seed44  (terceira seed)
            - name: NSGA_SEED
              value: "44"
            - name: NSGA_STABILIZATION_S
              value: "15"
            - name: NSGA_OUTPUT_DIR
              value: "/results/nsga-12-8-seed42"
            - name: NSGA_MOCK
              value: "false"
            # Defina como "true" para ignorar (e não gravar) o cache em /results/nsga/cache.jsonl
            - name: NSGA_NO_CACHE
              value: "false"
            # Elimina genomes duplicados na população P∪Q (default no código = true).
            # Tornado explícito aqui para reprodutibilidade no manifest do TCC.
            - name: NSGA_ELIMINATE_DUPLICATES
              value: "true"

            # ----- Search space (CPU em millicores, MEM em MiB) -----
            # Cluster: minikube --cpus=8 --memory=19g
            # Orçamento app-ga: ~5.3 cores / ~14 GiB (após kube-system + prometheus + jobs)
            # Pior caso rollout (maxSurge=1): 7 pods × 700m = 4.9 cores ≤ 5.3 ✓
            # Espaço total: 13 × 8 × 6 = 624 configs
            # Cobertura pop=16, gen=8 = 128 evals → ~20% (saudável)
            - name: NSGA_CPU_MIN
              value: "100"
            - name: NSGA_CPU_MAX
              value: "700"
            - name: NSGA_CPU_STEP
              value: "50"
            - name: NSGA_MEM_MIN
              value: "128"
            - name: NSGA_MEM_MAX
              value: "1024"
            - name: NSGA_MEM_STEP
              value: "128"
            - name: NSGA_REP_MIN
              value: "1"
            - name: NSGA_REP_MAX
              value: "4"

            # ----- Kubernetes / aplicação alvo -----
            - name: K8S_DEPLOYMENT_NAME
              value: "app-ga"
            - name: K8S_NAMESPACE
              value: "default"
            - name: K8S_ROLLOUT_TIMEOUT
              value: "300"
            - name: APP_URL
              value: "http://app-ga.default.svc.cluster.local:8080"
            - name: APP_LABEL
              value: "app-ga"

            # ----- Load test -----
            # Concurrency=22 calibrada empiricamente:
            # - extremo inferior (1×100m): colapso (success ~1%, throttle ~50%) ✓
            # - extremo superior (6×700m): saturação moderada (~52 RPS cap, ~54 RPS demanda)
            # Concurrency=30 saturava demais (throttle 72% no extremo superior, achatava f1).
            - name: LOAD_TEST_DURATION
              value: "90"
            - name: LOAD_TEST_CONCURRENCY
              value: "22"
            - name: LOAD_TEST_TIMEOUT
              value: "10"
            - name: LOAD_TEST_WARMUP_DURATION
              value: "15"
            - name: LOAD_TEST_WARMUP_CONCURRENCY
              value: "5"
            - name: LOAD_TEST_PROFILE
              value: "default"
            - name: LOAD_TEST_ENDPOINT
              value: "/mixed"

            # ----- Prometheus -----
            - name: PROMETHEUS_URL
              value: "http://prometheus-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090"
            - name: PROM_QUERY_TIMEOUT
              value: "10"
            - name: PROM_RETRY_ATTEMPTS
              value: "3"
            - name: PROM_RETRY_DELAY
              value: "1.0"

            # ----- Logging -----
            - name: LOG_LEVEL
              value: "INFO"
      volumes:
        - name: results
          persistentVolumeClaim:
            claimName: ga-results-pvc
