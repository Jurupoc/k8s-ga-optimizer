apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-ga
  namespace: default
  labels:
    app: app-ga
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  selector:
    matchLabels:
      app: app-ga
  template:
    metadata:
      labels:
        app: app-ga
    spec:
      containers:
      - name: app-ga
        image: app-ga:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 6

