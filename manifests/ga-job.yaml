apiVersion: batch/v1
kind: Job
metadata:
  name: ga-optimizer
  namespace: default
spec:
  backoffLimit: 0
  completions: 1
  parallelism: 1
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: ga-agent
      containers:
      - name: ga-optimizer
        image: ga-optimizer:latest
        imagePullPolicy: Never
        volumeMounts:
        - name: results
          mountPath: /results
        # Próximas execuções (editar SEED + --output-dir juntos):
        #   seed=44 → /results/ga-12-8-seed44  (terceira seed)
        command: ["python", "-u", "scripts/run_ga.py", "--output-dir", "/results/ga-12-8-seed44"]
        env:
        - name: PROMETHEUS_URL
          value: "http://prometheus-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090"
        - name: K8S_DEPLOYMENT_NAME
          value: "app-ga"
        - name: K8S_NAMESPACE
          value: "default"
        - name: K8S_CONTAINER_NAME
          value: "app-ga"
        - name: K8S_ROLLOUT_TIMEOUT
          value: "240"
        - name: K8S_API_TIMEOUT
          value: "120"
        - name: K8S_MAX_RETRIES
          value: "5"
        - name: K8S_RETRY_DELAY
          value: "10"
        - name: K8S_CLEANUP_PENDING_PODS
          value: "true"
        - name: K8S_CLEANUP_THRESHOLD
          value: "15"
        - name: APP_URL
          value: "http://app-ga.default.svc.cluster.local:8080"
        - name: APP_LABEL
          value: "app-ga"
        # Pop/Gen alinhados com NSGA-II e Random Search (mesmo orçamento de avaliações = 128)
        - name: GA_POPULATION
          value: "12"
        - name: GA_GENERATIONS
          value: "8"
        - name: GA_MUTATION_RATE
          value: "0.3"
        - name: GA_CROSSOVER_RATE
          value: "0.8"
        - name: GA_ELITISM_COUNT
          value: "1"
        - name: GA_TOURNAMENT_SIZE
          value: "2"
        # Seed do RNG: alinhada com o NSGA-II (mesma seed em ambos os
        # algoritmos para ter condições iniciais comparáveis).
        - name: GA_SEED
          value: "44"
        # Bounds + GRID DISCRETO equivalentes ao NSGA-II:
        #   NSGA_CPU [100m..700m] step=50m → GA_CPU [0.1..0.7] step=0.05 (em cores)
        #   NSGA_MEM [128..1024 MiB] step=128 → GA_MEMORY [128..1024] step=128
        #   NSGA_REP [1..4] → GA_REP [1..4]
        # Com GA_CPU_STEP/GA_MEMORY_STEP definidos, init/mutação/crossover
        # do GA são "snappados" ao mesmo grid do NSGA — comparação justa,
        # mesmo espaço de busca de 13 × 8 × 4 = 416 configs.
        - name: GA_REPLICAS_MIN
          value: "1"
        - name: GA_REPLICAS_MAX
          value: "4"
        - name: GA_CPU_MIN
          value: "0.1"
        - name: GA_CPU_MAX
          value: "0.7"
        - name: GA_CPU_STEP
          value: "0.05"
        - name: GA_MEMORY_MIN
          value: "128"
        - name: GA_MEMORY_MAX
          value: "1024"
        - name: GA_MEMORY_STEP
          value: "128"
        # Configurações de avaliação
        - name: GA_EVALUATION_DELAY
          value: "2"
        - name: GA_SLA_LATENCY_MS
          value: "2000.0"
        - name: GA_REQUIRE_PROMETHEUS_METRICS
          value: "false"  # Se true, falha avaliação se métricas não disponíveis
        # Configuração de warm-up
        - name: K8S_WARMUP_TIME
          value: "10"
        # Configurações de Load Test (IDÊNTICAS ao nsga-job.yaml e random-search-job.yaml
        # para permitir comparação justa entre algoritmos)
        - name: LOAD_TEST_DURATION
          value: "90"
        - name: LOAD_TEST_CONCURRENCY
          value: "22"
        - name: LOAD_TEST_TIMEOUT
          value: "10"
        - name: LOAD_TEST_PROFILE
          value: "default"
        - name: LOAD_TEST_WARMUP_DURATION
          value: "15"
        - name: LOAD_TEST_WARMUP_CONCURRENCY
          value: "5"
        # Endpoint entra na chave do cache (alinhado com nsga-job.yaml)
        - name: LOAD_TEST_ENDPOINT
          value: "/mixed"
        - name: LOAD_TEST_MIN_REQUESTS
          value: "50"
        - name: LOAD_TEST_MAX_ERROR_RATE
          value: "0.8"
        # Configurações de Prometheus
        - name: PROM_QUERY_TIMEOUT
          value: "10"
        - name: PROM_RETRY_ATTEMPTS
          value: "3"
        - name: PROM_RETRY_DELAY
          value: "1.0"
        # Configurações de Log
        - name: LOG_LEVEL
          value: "INFO"
      volumes:
      - name: results
        persistentVolumeClaim:
          claimName: ga-results-pvc
