apiVersion: batch/v1
kind: Job
metadata:
  name: ga-optimizer
  namespace: default
spec:
  backoffLimit: 0
  completions: 1
  parallelism: 1
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: ga-agent
      containers:
      - name: ga-optimizer
        image: ga-optimizer:latest
        imagePullPolicy: Never
        volumeMounts:
        - name: results
          mountPath: /results
        command: ["python", "-u", "scripts/run_ga.py"]
        env:
        - name: PROMETHEUS_URL
          value: "http://monitoring-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090"
        - name: K8S_DEPLOYMENT_NAME
          value: "app-ga"
        - name: K8S_NAMESPACE
          value: "default"
        - name: K8S_CONTAINER_NAME
          value: "app-ga"
        - name: K8S_ROLLOUT_TIMEOUT
          value: "240"
        - name: K8S_API_TIMEOUT
          value: "120"
        - name: K8S_MAX_RETRIES
          value: "5"
        - name: K8S_RETRY_DELAY
          value: "10"
        - name: K8S_CLEANUP_PENDING_PODS
          value: "true"
        - name: K8S_CLEANUP_THRESHOLD
          value: "15"
        - name: APP_URL
          value: "http://app-ga.default.svc.cluster.local:8080"
        - name: APP_LABEL
          value: "app-ga"
        - name: GA_POPULATION
          value: "5"
        - name: GA_GENERATIONS
          value: "10"
        - name: GA_MUTATION_RATE
          value: "0.3"
        - name: GA_CROSSOVER_RATE
          value: "0.8"
        - name: GA_ELITISM_COUNT
          value: "1"
        - name: GA_TOURNAMENT_SIZE
          value: "2"
        - name: GA_REPLICAS_MIN
          value: "1"
        - name: GA_REPLICAS_MAX
          value: "4"
        - name: GA_CPU_MIN
          value: "0.1"
        - name: GA_CPU_MAX
          value: "1.8"
        - name: GA_MEMORY_MIN
          value: "128"
        - name: GA_MEMORY_MAX
          value: "1024"
        # Novas configurações de avaliação
        - name: GA_EVALUATION_DELAY
          value: "2"
        - name: GA_SLA_LATENCY_MS
          value: "2000.0"
        # Configuração de warm-up
        - name: K8S_WARMUP_TIME
          value: "10"
        # Configurações de Load Test
        - name: LOAD_TEST_DURATION
          value: "30"
        - name: LOAD_TEST_CONCURRENCY
          value: "10"
        - name: LOAD_TEST_TIMEOUT
          value: "10"
        - name: LOAD_TEST_PROFILE
          value: ""  # Vazio = sem perfil (carga fixa). Opções: burst, wave, spiky, ramp_up, sustained
        - name: LOAD_TEST_WARMUP_DURATION
          value: "5"
        - name: LOAD_TEST_WARMUP_CONCURRENCY
          value: "2"
        - name: LOAD_TEST_MIN_REQUESTS
          value: "50"
        - name: LOAD_TEST_MAX_ERROR_RATE
          value: "0.8"
        # Configurações de Prometheus
        - name: PROM_QUERY_TIMEOUT
          value: "10"
        - name: PROM_RETRY_ATTEMPTS
          value: "3"
        - name: PROM_RETRY_DELAY
          value: "1.0"
        # Configurações de Log
        - name: LOG_LEVEL
          value: "INFO"
      volumes:
      - name: results
        persistentVolumeClaim:
          claimName: ga-results-pvc
